<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173e32" />
  <meta name="description" content="HomeCare Plus — planned, reliable home maintenance on a simple subscription." />
  <title>HomeCare Plus — Home, looked after.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#18352d;--muted:#718078;--green:#214f40;--green2:#2d7358;--lime:#d9edbe;--paper:#f5f6f1;--white:#fff;--line:#e5e9e2;--gold:#b47a2b;--red:#b94b45;--shadow:0 14px 36px rgba(20,49,39,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:#72917f}.wrap{max-width:1450px;margin:0 auto;padding:24px 30px 42px}.app-shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{background:#173e32;color:#e8f1e9;padding:28px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 32px}.brand-mark{width:37px;height:37px;border-radius:12px;background:#d9edbe;color:#1b4938;display:grid;place-items:center;font-size:20px;font-weight:900}.brand-name{font:800 16px Manrope,sans-serif;letter-spacing:-.5px}.brand-sub{color:#a6c0b2;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}.nav-label{color:#82a595;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:14px 13px 9px}.nav{display:grid;gap:4px}.nav button{background:none;border:0;color:#c5d5cb;text-align:left;padding:12px 13px;border-radius:11px;display:flex;align-items:center;gap:12px;font-weight:600;transition:.2s}.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}.nav-icon{width:20px;text-align:center;font-size:16px}.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:18px 9px 0;color:#a9c0b3}.profile-chip{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;background:#d9edbe;color:#234f3d;border-radius:50%;display:grid;place-items:center;font-weight:800}.profile-name{font-size:12px;color:#fff;font-weight:700}.profile-role{font-size:10px;color:#9db9aa;margin-top:3px}.main{min-width:0}.topbar{height:80px;background:rgba(255,255,255,.84);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.crumb{font-size:12px;color:var(--muted)}.top-title{font:700 17px Manrope,sans-serif;margin-top:4px}.top-right{display:flex;align-items:center;gap:13px}.icon-btn{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:12px;color:var(--green);display:grid;place-items:center}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#edf4ec;color:#426b55;font-size:11px;font-weight:700;padding:6px 10px}.pill.gold{background:#fbf3e5;color:#9a6b2b}.pill.red{background:#fcedec;color:#b94b45}.pill.blue{background:#edf2f8;color:#536d8e}.content{padding:30px 34px 52px;max-width:1450px;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{font:800 28px Manrope,sans-serif;letter-spacing:-1px;margin:5px 0 7px}.page-head p{color:var(--muted);margin:0;line-height:1.5}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:#173e32}.btn-soft{background:#eaf1e9;color:var(--green)}.btn-outline{background:#fff;color:var(--green);border:1px solid #dce5dc}.btn-danger{background:#fbedeb;color:#a9433c}.btn-ghost{background:transparent;color:var(--green);padding:8px 10px}.btn-sm{padding:8px 11px;font-size:12px;border-radius:8px}.btn-block{width:100%}.grid{display:grid;gap:18px}.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.stat-card,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px rgba(20,49,39,.025)}.stat-card{padding:18px 19px}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-icon{height:34px;width:34px;display:grid;place-items:center;background:#edf4ec;border-radius:11px;color:var(--green);font-size:16px}.stat-card strong{display:block;font:800 26px Manrope,sans-serif;letter-spacing:-1px;margin:12px 0 3px}.stat-label{font-size:12px;color:var(--muted)}.stat-foot{font-size:10px;color:#6c9578;margin-top:10px}.hero{background:#214f40;color:#fff;border-radius:21px;padding:30px 32px;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;overflow:hidden;position:relative;margin-bottom:22px;min-height:210px}.hero:after{content:'';position:absolute;width:330px;height:330px;border:1px solid rgba(226,244,218,.17);border-radius:50%;right:-54px;top:-120px;box-shadow:0 0 0 34px rgba(226,244,218,.045),0 0 0 70px rgba(226,244,218,.035)}.hero h2{font:800 30px Manrope,sans-serif;line-height:1.15;letter-spacing:-1px;margin:12px 0}.hero p{color:#cbded1;max-width:540px;line-height:1.65;margin:0 0 19px}.hero .eyebrow{color:#c6dfac}.hero-art{display:flex;justify-content:flex-end;align-items:center;position:relative;z-index:1}.home-illustration{width:190px;height:154px;border-radius:22px;background:#d8edbf;display:grid;place-items:center;color:#24513f;font-size:65px;transform:rotate(4deg);box-shadow:20px 18px 0 rgba(11,43,31,.2)}.section-grid{grid-template-columns:1.4fr 1fr}.card{padding:21px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.card-head h3{font:800 16px Manrope,sans-serif;margin:0}.service-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.service-tile{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;transition:.18s;cursor:pointer}.service-tile:hover{border-color:#9fbea9;transform:translateY(-2px);box-shadow:var(--shadow)}.service-ico{height:38px;width:38px;border-radius:12px;background:#edf4ec;color:var(--green);display:grid;place-items:center;font-size:18px;margin-bottom:12px}.service-tile h4{font-weight:800;margin:0 0 5px}.service-tile p{font-size:11px;line-height:1.45;color:var(--muted);margin:0 0 12px}.service-price{font-weight:800;font-size:13px}.plan-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.plan-card{padding:23px;position:relative;overflow:hidden}.plan-card.featured{border:1.5px solid #7da58b;box-shadow:0 10px 28px rgba(33,79,64,.09)}.plan-card .price{font:800 30px Manrope,sans-serif;letter-spacing:-1.1px;margin:18px 0 3px}.plan-card .price small{font:500 12px 'DM Sans',sans-serif;color:var(--muted);letter-spacing:0}.plan-card h3{font:800 18px Manrope,sans-serif;margin:0}.plan-card p{color:var(--muted);min-height:38px;line-height:1.5;font-size:12px}.features{list-style:none;padding:13px 0 18px;margin:0;display:grid;gap:11px;border-top:1px solid var(--line)}.features li{display:flex;gap:9px;font-size:12px;color:#52665a;line-height:1.35}.check{color:#4c8c62;font-weight:900}.feature-tag{position:absolute;right:17px;top:17px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th{text-align:left;color:#86938b;text-transform:uppercase;letter-spacing:.1em;font-size:10px;padding:12px 11px;border-bottom:1px solid var(--line)}td{padding:14px 11px;border-bottom:1px solid #edf0eb;font-size:12px;color:#41554a}tr:last-child td{border-bottom:0}.person-cell{display:flex;align-items:center;gap:9px;font-weight:700}.mini-avatar{width:28px;height:28px;border-radius:9px;background:#ecf3e9;display:grid;place-items:center;color:var(--green)}.status{font-size:10px;font-weight:800;text-transform:capitalize;padding:5px 9px;border-radius:99px;display:inline-block;background:#edf3ed;color:#51775a}.status.pending{background:#fff3df;color:#a16f28}.status.completed,.status.accepted{background:#eaf5eb;color:#467a50}.status.cancelled,.status.rejected,.status.refunded{background:#fcecea;color:#b34e46}.status.disputed{background:#f0edfb;color:#6b5ca0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#4d6356}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe6de;background:#fbfcfa;border-radius:9px;padding:12px 13px;outline:0;color:var(--ink);transition:.15s}.field input:focus,.field select:focus,.field textarea:focus{border-color:#83ad91;box-shadow:0 0 0 3px #eaf3e8}.field textarea{min-height:90px;resize:vertical}.field small{font-size:10px;color:var(--muted)}.booking-layout{grid-template-columns:1fr 330px;align-items:start}.price-summary{background:#f0f5ed;border:1px solid #e0eadf;border-radius:13px;padding:16px}.price-row{display:flex;justify-content:space-between;margin:8px 0;font-size:12px}.price-total{font:800 20px Manrope,sans-serif;border-top:1px solid #dce7d8;padding-top:12px;margin-top:13px;display:flex;justify-content:space-between}.empty{padding:36px 16px;text-align:center;color:var(--muted)}.empty-ico{font-size:32px;margin-bottom:8px}.empty h3{color:var(--ink);font:800 16px Manrope,sans-serif;margin:8px}.notice{background:#f1f7eb;border:1px solid #dfebd8;color:#4d6d55;padding:12px 14px;border-radius:11px;font-size:12px;line-height:1.5}.auth-page{min-height:100vh;background:#f3f5ef;display:grid;grid-template-columns:1fr 1fr}.auth-visual{background:#173e32;color:#fff;padding:9vw 7vw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.auth-visual:after{content:'';position:absolute;width:540px;height:540px;border:1px solid rgba(255,255,255,.14);border-radius:50%;right:-180px;bottom:-190px;box-shadow:0 0 0 45px rgba(255,255,255,.035),0 0 0 95px rgba(255,255,255,.025)}.auth-visual h1{font:800 clamp(38px,5vw,65px) Manrope,sans-serif;line-height:1.03;letter-spacing:-2px;max-width:540px;position:relative;z-index:1}.auth-visual p{color:#c5d9cd;line-height:1.7;max-width:490px;font-size:15px;position:relative;z-index:1}.auth-panel{display:grid;place-items:center;padding:30px}.auth-box{width:min(430px,100%)}.auth-box h2{font:800 26px Manrope,sans-serif;margin:7px 0}.auth-switch{display:flex;background:#edf1e9;padding:4px;border-radius:10px;margin:20px 0}.auth-switch button{flex:1;background:transparent;border:0;padding:10px;border-radius:8px;color:var(--muted);font-weight:700}.auth-switch button.active{background:#fff;color:var(--green);box-shadow:0 2px 8px #163c3010}.demo-box{background:#f0f5ed;border:1px solid #dfe9db;border-radius:11px;padding:13px;margin-top:16px;font-size:11px;line-height:1.7}.demo-row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #dce6d8;padding-top:8px;margin-top:8px}.link-btn{background:transparent;border:0;color:var(--green2);font-weight:800;padding:0}.toast{position:fixed;right:22px;bottom:22px;z-index:20;background:#193f32;color:#fff;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 30px));font-size:12px}.toast.error{background:#9d3e38}.modal-backdrop{position:fixed;inset:0;background:rgba(13,37,28,.48);z-index:30;display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:23px;box-shadow:0 24px 80px #0e2e2260;max-height:90vh;overflow:auto}.modal h3{font:800 20px Manrope,sans-serif;margin:0 0 7px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}.progress-track{height:7px;background:#edf1eb;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:#6c9c77;border-radius:99px}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}.renewal{background:#f8f5e9;border:1px solid #efe8d3;color:#8c733e;padding:12px;border-radius:11px;font-size:11px}.mobile-menu{display:none}
    @media(max-width:1100px){.app-shell{grid-template-columns:214px 1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}.plan-grid{grid-template-columns:repeat(2,1fr)}.service-grid{grid-template-columns:repeat(2,1fr)}.section-grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr .5fr}.booking-layout{grid-template-columns:1fr}}
    @media(max-width:720px){.app-shell{display:block}.sidebar{position:fixed;left:-270px;width:250px;transition:left .2s;box-shadow:18px 0 40px #102e2444}.sidebar.open{left:0}.mobile-menu{display:grid}.topbar{height:70px;padding:0 17px}.content{padding:22px 16px 40px}.wrap{padding:20px 16px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:24px}.hero{grid-template-columns:1fr;padding:24px;min-height:0}.hero-art{display:none}.stats-grid{gap:10px}.stat-card{padding:14px}.stat-card strong{font-size:22px}.plan-grid,.service-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.auth-page{grid-template-columns:1fr}.auth-visual{min-height:265px;padding:32px 26px}.auth-visual h1{font-size:38px;margin:20px 0 10px}.auth-visual p{font-size:12px}.auth-panel{padding:28px 20px}.top-title{font-size:15px}}
  </style>

<body>
<div id="app"><div style="padding:40px;color:#214f40;font-weight:800">Loading HomeCare Plus…</div></div>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>
<script>
const API='/api';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
let state={token:localStorage.getItem('hcp_token')||'',user:null,view:'overview',plans:[],services:[],dashboard:null,authMode:'login',registerRole:'customer',loading:false};
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.classList.remove('hidden','error');if(error)el.classList.add('error');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3600)}
async function api(path,options={}){const headers={'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{}),...(options.headers||{})};const response=await fetch(API+path,{...options,headers,body:options.body?JSON.stringify(options.body):undefined});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||'Request failed');return data}
function initials(name='HC'){return name.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function moneyLabel(amount,cadence){return `<span class="price">${inr(amount)}<small> / ${cadence.toLowerCase()}</small></span>`}
function badge(status){return `<span class="status ${esc(status)}">${esc(status)}</span>`}
function stat(label,value,icon,foot=''){return `<div class="stat-card"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><div class="stat-foot">${foot}</div></div>`}
function pageHead(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function navItems(){if(state.user.role==='customer')return [['overview','◫','Overview'],['plans','♧','Care plans'],['book','＋','Book a service'],['bookings','▤','My bookings'],['payments','₹','Payment history']];if(state.user.role==='professional')return [['overview','◫','My overview'],['jobs','▣','Job requests']];return [['overview','◫','Overview'],['plans','♧','Plans & pricing'],['professionals','♙','Professionals'],['bookings','▤','All bookings'],['payments','₹','Payments & revenue']]}
function shell(inner){const items=navItems();return `<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">⌂</div><div><div class="brand-name">HomeCare Plus</div><div class="brand-sub">Home, looked after.</div></div></div><div class="nav-label">Workspace</div><nav class="nav">${items.map(([id,ico,label])=>`<button data-nav="${id}" class="${state.view===id?'active':''}"><span class="nav-icon">${ico}</span>${label}</button>`).join('')}</nav><div class="nav-label" style="margin-top:18px">Support</div><nav class="nav"><button data-action="help"><span class="nav-icon">?</span>Help centre</button><button data-action="logout"><span class="nav-icon">↗</span>Sign out</button></nav><div class="sidebar-bottom"><div class="profile-chip"><div class="avatar">${initials(state.user.name)}</div><div><div class="profile-name">${esc(state.user.name)}</div><div class="profile-role">${esc(state.user.role)} account</div></div></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="icon-btn mobile-menu" data-action="menu">☰</button><div><div class="crumb">HomeCare Plus / ${esc(state.view.replace(/-/g,' '))}</div><div class="top-title">${state.view==='overview'?'Good to see you, '+esc(state.user.name.split(' ')[0]):esc(state.view.replace(/-/g,' ').replace(/\b\w/g,x=>x.toUpperCase()))}</div></div></div><div class="top-right"><span class="pill">● System operational</span><div class="avatar">${initials(state.user.name)}</div></div></header><section class="content">${inner}</section></main></div>`}
function authPage(){return `<div class="auth-page"><section class="auth-visual"><div class="brand"><div class="brand-mark">⌂</div><div><div class="brand-name">HomeCare Plus</div><div class="brand-sub">Home, looked after.</div></div></div><div><div class="eyebrow" style="color:#bddba8">A better way to care for your home</div><h1>Small care today.<br>Fewer surprises tomorrow.</h1><p>Plan the essentials, book trusted local professionals and keep every home service in one calm, simple place.</p></div><div class="small" style="color:#9db9aa">Subscription-based home maintenance · Hyderabad, India</div></section><section class="auth-panel"><div class="auth-box"><div class="eyebrow">Welcome to a well-kept home</div><h2>${state.authMode==='login'?'Sign in to your account':'Create your account'}</h2><p class="muted">${state.authMode==='login'?'Manage your home care in one place.':'A little information to get your home care started.'}</p><div class="auth-switch"><button data-authmode="login" class="${state.authMode==='login'?'active':''}">Sign in</button><button data-authmode="register" class="${state.authMode==='register'?'active':''}">Create account</button></div><form id="auth-form" class="grid" style="gap:13px">${state.authMode==='register'?`<div class="field"><label>Full name</label><input name="name" placeholder="e.g. Ananya Rao" required></div><div class="field"><label>Phone number</label><input name="phone" placeholder="+91 98765 43210" required></div><div class="field"><label>Account type</label><select name="role" id="register-role"><option value="customer">Customer</option><option value="professional">Service professional</option></select></div><div id="pro-fields" class="field full hidden"><label>Service categories</label><div style="display:flex;flex-wrap:wrap;gap:12px;padding:10px 0"><label class="small"><input type="checkbox" name="categories" value="Cleaning" checked> Cleaning</label><label class="small"><input type="checkbox" name="categories" value="Plumbing"> Plumbing</label><label class="small"><input type="checkbox" name="categories" value="Electrical"> Electrical</label><label class="small"><input type="checkbox" name="categories" value="AC & Appliance"> AC & appliance</label></div><label>Verification document / ID reference</label><input name="documentRef" placeholder="Enter a document reference (demo)"><small>For the MVP, this is a reference field only. Do not upload sensitive ID documents.</small></div><div class="field"><label>Email address</label><input type="email" name="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input type="password" name="password" minlength="8" placeholder="At least 8 characters" required></div>`:`<div class="field"><label>Email address</label><input type="email" name="email" placeholder="you@example.com" value="" required></div><div class="field"><label>Password</label><input type="password" name="password" placeholder="Your password" required></div>`}<button class="btn btn-primary btn-block" type="submit">${state.authMode==='login'?'Sign in →':'Create account →'}</button></form><div class="demo-box"><strong>Demo access</strong><div class="muted">Use these accounts to explore all three dashboards.</div><div class="demo-row"><span>Customer · customer@homecareplus.demo</span><button class="link-btn" data-demo="customer">Use</button></div><div class="demo-row"><span>Professional · pro@homecareplus.demo</span><button class="link-btn" data-demo="professional">Use</button></div><div class="demo-row"><span>Admin · admin@homecareplus.demo</span><button class="link-btn" data-demo="admin">Use</button></div><div class="small muted" style="margin-top:7px">Demo password: Customer@12345 · Pro@12345 · Admin@12345 respectively.</div></div></div></section></div>`}
function serviceCards(){return `<div class="grid service-grid">${state.services.map(s=>`<div class="service-tile" data-service="${s.id}"><div class="service-ico">${s.icon}</div><h4>${esc(s.name)}</h4><p>${esc(s.detail)} · ${esc(s.duration)}</p><div class="split"><span class="service-price">${inr(s.price)} <span class="muted small">from</span></span><span class="muted">→</span></div></div>`).join('')}</div>`}
function planCards(admin=false){return `<div class="grid plan-grid">${state.plans.map(p=>`<article class="card plan-card ${p.recommended?'featured':''}">${p.recommended?'<span class="pill feature-tag">Most popular</span>':''}<div class="eyebrow">${esc(p.cadence)} subscription</div><h3>${esc(p.name)}</h3>${moneyLabel(p.price,p.cadence)}<p>${esc(p.description)}</p><ul class="features">${p.features.map(f=>`<li><span class="check">✓</span>${esc(f)}</li>`).join('')}</ul>${admin?`<button class="btn btn-outline btn-block" data-editplan="${p.id}">Edit plan & pricing</button><div style="margin-top:9px">${p.active===false?'<span class="pill red">Inactive</span>':'<span class="pill">Active</span>'}</div>`:`<button class="btn ${p.recommended?'btn-primary':'btn-soft'} btn-block" data-buyplan="${p.id}">Choose plan →</button>`}</article>`).join('')}</div>`}
function bookingRows(rows,admin=false){if(!rows?.length)return `<div class="empty"><div class="empty-ico">⌂</div><h3>No service requests yet</h3><div class="small">Your upcoming home care activity will appear here.</div></div>`;return `<div class="table-wrap"><table><thead><tr><th>Service</th><th>${admin?'Customer':'Date & time'}</th>${admin?'<th>Date</th>':''}<th>Professional</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr><td><div class="person-cell"><span class="mini-avatar">${b.category==='Cleaning'?'✦':b.category==='Plumbing'?'⌁':b.category==='Electrical'?'ϟ':'❄'}</span><div>${esc(b.serviceName)}<div class="small muted">${inr(b.price)}</div></div></div></td><td>${admin?esc(b.customerName):`${esc(b.date)}<div class="small muted">${esc(b.slot)}</div>`}</td>${admin?`<td>${esc(b.date)}</td>`:''}<td>${esc(b.professionalName||'Awaiting assignment')}</td><td>${badge(b.status)}</td><td>${admin?`<button class="btn btn-sm btn-outline" data-bookstatus="${b.id}" data-status="${b.status==='disputed'?'refunded':'disputed'}">${b.status==='disputed'?'Mark refunded':'Flag dispute'}</button>`:`<button class="btn btn-sm btn-ghost" data-bookdetail="${b.id}">Details ↗</button>`}</td></tr>`).join('')}</tbody></table></div>`}
function customerOverview(){const d=state.dashboard||{},sub=d.subscription;const next=sub?new Date(sub.renewalDate):null;const days=next?Math.ceil((next-Date.now())/86400000):0;const reminder=days>=0&&days<=7?`<div class="renewal" style="margin-bottom:17px">Your ${esc(sub.planName)} plan renews in ${days} day${days===1?'':'s'} (${next.toLocaleDateString('en-IN')}). This is a demo reminder; no automatic charge will occur.</div>`:'';return `${pageHead('CUSTOMER SPACE','Your home, looked after.','A clearer view of the small things that keep your home running.',`<button class="btn btn-primary" data-nav="book">＋ Book a service</button>`)}<div class="hero"><div><div class="eyebrow">The easy way to stay on top of home care</div><h2>Good homes are<br>looked after.</h2><p>Keep routine maintenance planned, bring trusted help closer and spend less time worrying about the next repair.</p><button class="btn" style="background:#d9edbe;color:#1c4938" data-nav="plans">Explore care plans →</button></div><div class="hero-art"><div class="home-illustration">⌂</div></div></div>${reminder}<div class="grid stats-grid">${stat('Active subscription',sub?esc(sub.planName):'None','♧',sub?`${esc(sub.cadence)} · ${days>0?days+' days remaining':'Renewal due'}`:'Choose a plan to get started')}${stat('Service requests',d.bookings?.length||0,'▤','All your home visits in one place')}${stat('Completed visits',d.bookings?.filter(x=>x.status==='completed').length||0,'✓','Your maintenance history')}${stat('Payment records',d.payments?.length||0,'₹','Dummy payment ledger')}</div><div class="grid section-grid"><div class="card"><div class="card-head"><div><div class="eyebrow">On-demand help</div><h3>Book a home service</h3></div><button class="btn btn-ghost btn-sm" data-nav="book">View all →</button></div>${serviceCards()}</div><div class="card"><div class="card-head"><div><div class="eyebrow">Your plan</div><h3>${sub?esc(sub.planName):'Start with a care plan'}</h3></div>${sub?'<span class="pill">Active</span>':'<span class="pill gold">No plan</span>'}</div>${sub?`<p class="muted small">${esc(sub.cadence)} · ${inr(sub.amount)} paid</p><div class="split" style="margin:18px 0 8px"><span class="small muted">Renewal date</span><strong>${new Date(sub.renewalDate).toLocaleDateString('en-IN')}</strong></div><div class="progress-track"><div class="progress-fill" style="width:${Math.max(5,Math.min(100,100-days/sub.periodDays*100))}%"></div></div><div class="small muted" style="margin-top:8px">Your current plan stays active until the renewal date.</div>`:`<p class="muted small" style="line-height:1.6">Choose monthly, quarterly or yearly home care. Your dummy checkout records the subscription with no real charge.</p><button class="btn btn-primary btn-block" data-nav="plans">Compare plans</button>`}</div></div><div class="card" style="margin-top:19px"><div class="card-head"><div><div class="eyebrow">Coming up</div><h3>Recent service requests</h3></div><button class="btn btn-ghost btn-sm" data-nav="bookings">See all →</button></div>${bookingRows((d.bookings||[]).slice(0,5))}</div>`}
function plansView(admin=false){return `${pageHead(admin?'ADMINISTRATION':'MEMBERSHIP','Care plans & pricing','Straightforward plans for routine home maintenance. All payments in this MVP are simulated.',admin?'<span class="pill gold">Admin · plan controls</span>':'')}${admin?'<div class="notice" style="margin-bottom:18px">Changes to plans are saved to the app’s private data store. Prices are demo prices in INR; no payment gateway is connected.</div>':''}${planCards(admin)}`}
function bookView(){return `${pageHead('SERVICE BOOKING','Book a home service','Choose a service, share a suitable time and we’ll route the request to an approved professional.') }<div class="grid booking-layout"><div class="card"><form id="booking-form" class="grid" style="gap:16px"><div class="form-grid"><div class="field full"><label>Choose a service</label><select name="serviceId" id="service-select" required>${state.services.map(s=>`<option value="${s.id}">${esc(s.name)} — ${inr(s.price)}</option>`).join('')}</select></div><div class="field"><label>Preferred date</label><input type="date" name="date" id="booking-date" required min="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Time slot</label><select name="slot" required><option>09:00 AM – 11:00 AM</option><option>10:00 AM – 12:00 PM</option><option>12:00 PM – 02:00 PM</option><option>02:00 PM – 04:00 PM</option><option>04:00 PM – 06:00 PM</option></select></div><div class="field full"><label>Service address</label><input name="address" value="${esc(state.user.address||'')}" placeholder="Flat / house, street, locality, city" required></div><div class="field full"><label>Anything the professional should know? <span class="muted">(optional)</span></label><textarea name="notes" placeholder="Describe the issue or any access instructions…"></textarea></div></div><div class="notice">Your request is confirmed only after an approved professional accepts it. Service visits are paid separately unless explicitly covered by your subscription.</div><button class="btn btn-primary" type="submit">Submit service request →</button></form></div><aside class="card"><div class="eyebrow">Service estimate</div><h3 id="estimate-name" style="font:800 19px Manrope;margin:8px 0">Home cleaning</h3><p id="estimate-detail" class="muted small">Kitchen, bathrooms and living areas</p><div class="price-summary"><div class="price-row"><span>Base service price</span><strong id="estimate-price">₹699</strong></div><div class="price-row"><span>Booking fee</span><span>₹0</span></div><div class="price-total"><span>Estimated total</span><span id="estimate-total">₹699</span></div></div><p class="small muted" style="line-height:1.6;margin-top:14px">This is an indicative rate. Final charges for parts or additional work are agreed with the professional before service.</p></aside></div>`}
function bookingsView(){return `${pageHead('YOUR HOME CARE','My bookings','Track requests, upcoming visits and completed work.',`<button class="btn btn-primary" data-nav="book">＋ New booking</button>`)}<div class="card">${bookingRows(state.dashboard?.bookings||[])}</div>${(state.dashboard?.bookings||[]).filter(b=>b.status==='completed'&&!state.dashboard.reviews?.some(r=>r.bookingId===b.id)).length?`<div class="card" style="margin-top:18px"><h3 style="font:800 16px Manrope;margin-top:0">Share your feedback</h3>${state.dashboard.bookings.filter(b=>b.status==='completed'&&!state.dashboard.reviews?.some(r=>r.bookingId===b.id)).map(b=>`<form class="review-form" data-review="${b.id}" style="border-top:1px solid var(--line);padding:13px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:end"><div style="flex:1"><strong>${esc(b.serviceName)}</strong><div class="small muted">${esc(b.date)}</div></div><div class="field"><label>Rating</label><select name="rating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Average</option><option value="2">2 — Poor</option><option value="1">1 — Bad</option></select></div><div class="field"><label>Feedback</label><input name="feedback" placeholder="What went well?" style="min-width:180px"></div><button class="btn btn-primary btn-sm">Submit review</button></form>`).join('')}</div>`:''}`}
function paymentsView(){const rows=state.dashboard?.payments||[];return `${pageHead('TRANSACTION HISTORY','Payments & receipts','All subscription and service transactions recorded on this demo account.') }<div class="card">${rows.length?`<div class="table-wrap"><table><thead><tr><th>Description</th><th>Date</th><th>Method</th><th>Reference</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(p=>`<tr><td><strong>${esc(p.description||'Home service')}</strong><div class="small muted">${p.isDummy?'Demo transaction':''}</div></td><td>${new Date(p.createdAt).toLocaleDateString('en-IN')}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td><td><strong>${inr(p.amount)}</strong></td><td>${badge(p.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="empty-ico">₹</div><h3>No payments yet</h3><div class="small">Subscription checkouts will appear here.</div><button class="btn btn-soft" data-nav="plans" style="margin-top:14px">Explore plans</button></div>'}</div><div class="notice" style="margin-top:16px">Payments are simulated for evaluation. No UPI, card or net-banking transaction is sent to a bank or payment gateway.</div>`}
function professionalOverview(){const d=state.dashboard||{},jobs=d.bookings||[],open=jobs.filter(x=>['pending','accepted'].includes(x.status));return `${pageHead('PROFESSIONAL SPACE','Your service desk','Manage your requests, availability and completed visits.') }<div class="grid stats-grid">${stat('Open requests',open.length,'▣','Pending and accepted jobs')}${stat('Completed visits',jobs.filter(x=>x.status==='completed').length,'✓','Work marked complete')}${stat('Customer rating',d.reviews?.length?(d.reviews.reduce((s,x)=>s+x.rating,0)/d.reviews.length).toFixed(1)+'/5':'—','☆','Based on customer feedback')}${stat('Estimated earnings',inr(jobs.filter(x=>x.status==='completed').reduce((s,x)=>s+x.price*.85,0)),'₹','85% of completed service value')}${stat('Availability',d.profile?.available?'Available':'Away','●',d.profile?.approved?'Profile approved':'Awaiting admin approval')}</div><div class="card"><div class="card-head"><div><div class="eyebrow">Your profile</div><h3>Availability & service categories</h3></div><label class="pill"><input type="checkbox" id="availability-toggle" ${d.profile?.available?'checked':''} style="accent-color:#2d7358"> Available for jobs</label></div><div class="small muted">Approved: ${d.profile?.approved?'Yes':'Pending admin approval'} · Categories: ${(d.profile?.categories||[]).map(esc).join(', ')}</div></div><div class="card" style="margin-top:18px"><div class="card-head"><div><div class="eyebrow">Work queue</div><h3>Job requests</h3></div></div>${jobsView(jobs,true)}</div>`}
function jobsView(jobs,actions=false){if(!jobs.length)return `<div class="empty"><div class="empty-ico">▣</div><h3>No jobs available</h3><div class="small">New requests will appear here.</div></div>`;return `<div class="grid" style="gap:12px">${jobs.map(b=>`<article style="border:1px solid var(--line);border-radius:13px;padding:16px"><div class="split"><div><div class="eyebrow">${esc(b.category)}</div><h3 style="font:800 15px Manrope;margin:5px 0">${esc(b.serviceName)}</h3><div class="small muted">${esc(b.customerName)} · ${esc(b.date)} · ${esc(b.slot)}</div></div>${badge(b.status)}</div><p class="small muted" style="line-height:1.55">${esc(b.address)}${b.notes?' · '+esc(b.notes):''}</p><div class="split"><strong>${inr(b.price)}</strong><div style="display:flex;gap:7px">${b.status==='pending'?`<button class="btn btn-soft btn-sm" data-job="${b.id}" data-status="accepted">Accept</button><button class="btn btn-danger btn-sm" data-job="${b.id}" data-status="rejected">Decline</button>`:''}${b.status==='accepted'?`<button class="btn btn-primary btn-sm" data-job="${b.id}" data-status="completed">Mark complete</button>`:''}</div></div></article>`).join('')}</div>`}
function adminOverview(){const d=state.dashboard||{},s=d.stats||{};return `${pageHead('ADMIN CONTROL CENTRE','Platform overview','Monitor service activity, subscriptions, professionals and revenue.') }<div class="grid stats-grid">${stat('Monthly recurring revenue',inr(s.mrr),'₹','Normalised from active subscriptions')}${stat('Active subscriptions',s.activeSubscriptions||0,'♧','Current paid plans')}${stat('Service requests',s.bookings||0,'▤',`${s.pending||0} currently pending`)}${stat('Average service rating',s.averageRating||'—','☆','From submitted reviews')}${stat('Commission estimate',inr(s.commission||0),'↗','15% modelled service commission')}</div><div class="grid section-grid"><div class="card"><div class="card-head"><div><div class="eyebrow">Operations</div><h3>Recent service requests</h3></div><button class="btn btn-ghost btn-sm" data-nav="bookings">All bookings →</button></div>${bookingRows((d.bookings||[]).slice(0,6),true)}</div><div class="card"><div class="eyebrow">People & supply</div><h3 style="font:800 16px Manrope;margin:7px 0 18px">Platform health</h3><div class="split" style="margin:12px 0"><span class="muted small">Customers</span><strong>${s.customers||0}</strong></div><div class="split" style="margin:12px 0"><span class="muted small">Professionals</span><strong>${s.professionals||0}</strong></div><div class="split" style="margin:12px 0"><span class="muted small">Awaiting approval</span><strong>${s.pendingProfessionals||0}</strong></div><div class="split" style="margin:12px 0"><span class="muted small">Completed services</span><strong>${s.completed||0}</strong></div><div class="notice" style="margin-top:17px">Platform commission is modelled at 15% of accepted/completed service value. This is a demo KPI, not a settlement ledger.</div></div></div>`}
function professionalsView(){return `${pageHead('PARTNER NETWORK','Service professionals','Review applications and approve trusted local service providers.') }<div class="card"><div id="professionals-list"><div class="empty">Loading professionals…</div></div></div>`}
function adminBookingsView(){return `${pageHead('SERVICE OPERATIONS','All bookings','Review requests and handle disputes or refunds.') }<div class="card">${bookingRows(state.dashboard?.bookings||[],true)}</div>`}
function render(){if(!state.user){$('#app').innerHTML=authPage();return}let inner='';if(state.user.role==='customer'){if(state.view==='overview')inner=customerOverview();else if(state.view==='plans')inner=plansView();else if(state.view==='book')inner=bookView();else if(state.view==='bookings')inner=bookingsView();else if(state.view==='payments')inner=paymentsView();}else if(state.user.role==='professional'){if(state.view==='overview')inner=professionalOverview();else inner=`${pageHead('WORK QUEUE','Job requests','Accept work, update the status and keep customers informed.')}${jobsView(state.dashboard?.bookings||[],true)}`;}else{if(state.view==='overview')inner=adminOverview();else if(state.view==='plans')inner=plansView(true);else if(state.view==='professionals')inner=professionalsView();else if(state.view==='bookings')inner=adminBookingsView();else if(state.view==='payments')inner=paymentsView();}$('#app').innerHTML=shell(inner);if(state.view==='professionals')loadProfessionals();if(state.view==='book')updateEstimate()}
async function refresh(){state.plans=await api('/plans');state.services=await api('/services');if(state.user)state.dashboard=await api('/dashboard');}
async function enter(token,user){state.token=token;state.user=user;localStorage.setItem('hcp_token',token);state.view='overview';await refresh();render()}
function logout(){state.token='';state.user=null;state.dashboard=null;localStorage.removeItem('hcp_token');state.authMode='login';render()}
async function login(email,password){const data=await api('/auth/login',{method:'POST',body:{email,password}});await enter(data.token,data.user);toast('Welcome back, '+data.user.name.split(' ')[0]+'.')}
async function loadProfessionals(){try{const rows=await api('/admin/professionals');$('#professionals-list').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Professional</th><th>Phone</th><th>Categories</th><th>Approval</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td><div class="person-cell"><span class="mini-avatar">${initials(p.name)}</span>${esc(p.name)}</div><div class="small muted">${esc(p.email)}</div></td><td>${esc(p.phone)}</td><td>${(p.categories||[]).map(esc).join(', ')}</td><td>${p.approved?'<span class="pill">Approved</span>':'<span class="pill gold">Pending</span>'}</td><td>${p.approved?'<span class="small muted">No action</span>':`<button class="btn btn-primary btn-sm" data-approve="${p.id}">Approve</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>No professional applications</h3></div>'}catch(e){toast(e.message,true)}}
function updateEstimate(){const s=state.services.find(x=>x.id===$('#service-select')?.value)||state.services[0];if(!s)return;$('#estimate-name').textContent=s.name;$('#estimate-detail').textContent=s.detail+' · '+s.duration;$('#estimate-price').textContent=inr(s.price);$('#estimate-total').textContent=inr(s.price)}
function showModal(html){$('#modal-root').innerHTML=`<div class="modal-backdrop" data-closemodal><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`}
function hideModal(){$('#modal-root').innerHTML=''}
async function purchase(planId){const p=state.plans.find(x=>x.id===planId);if(!p)return;showModal(`<div class="eyebrow">Secure demo checkout</div><h3>${esc(p.name)} · ${esc(p.cadence)}</h3><p class="muted small">Review the order. This is a simulated payment only; no money will be charged.</p><div class="price-summary"><div class="price-row"><span>Subscription</span><strong>${esc(p.name)}</strong></div><div class="price-row"><span>Billing cycle</span><span>${esc(p.cadence)}</span></div><div class="price-total"><span>Total due</span><span>${inr(p.price)}</span></div></div><form id="checkout-form" style="margin-top:15px"><div class="field"><label>Payment method</label><select name="method"><option>UPI</option><option>Card</option><option>Net Banking</option></select></div><div class="notice" style="margin-top:13px">Demo mode · Transaction is recorded as successful for testing. No bank or payment provider is contacted.</div><div class="modal-actions"><button type="button" class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary">Pay ${inr(p.price)} (Demo)</button></div></form>`);$('#checkout-form').onsubmit=async e=>{e.preventDefault();try{const method=new FormData(e.target).get('method');const result=await api('/subscriptions/checkout',{method:'POST',body:{planId,method}});hideModal();await refresh();state.view='overview';render();toast(result.message)}catch(err){toast(err.message,true)}}}
function editPlan(planId){const p=state.plans.find(x=>x.id===planId);showModal(`<div class="eyebrow">Plan management</div><h3>Edit ${esc(p.name)}</h3><form id="plan-form" class="grid" style="gap:12px"><div class="field"><label>Plan name</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Price (INR)</label><input type="number" name="price" min="99" max="100000" value="${p.price}" required></div><div class="field"><label>Description</label><input name="description" value="${esc(p.description)}"></div><label class="small"><input type="checkbox" name="active" ${p.active===false?'':'checked'}> Plan available to customers</label><div class="modal-actions"><button type="button" class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary">Save changes</button></div></form>`);$('#plan-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/admin/plans/update',{method:'PATCH',body:{id:planId,name:f.get('name'),price:Number(f.get('price')),description:f.get('description'),active:f.has('active')}});hideModal();await refresh();render();toast('Plan updated.')}catch(err){toast(err.message,true)}}}

document.addEventListener('click',async e=>{const nav=e.target.closest('[data-nav]');if(nav){state.view=nav.dataset.nav;$('#sidebar')?.classList.remove('open');if(state.view==='overview'||state.view==='bookings'||state.view==='payments'||state.view==='professionals')await refresh();render();return}const demo=e.target.closest('[data-demo]');if(demo){const data={customer:['customer@homecareplus.demo','Customer@12345'],professional:['pro@homecareplus.demo','Pro@12345'],admin:['admin@homecareplus.demo','Admin@12345']}[demo.dataset.demo];try{await login(...data)}catch(err){toast(err.message,true)}return}const mode=e.target.closest('[data-authmode]');if(mode){state.authMode=mode.dataset.authmode;render();return}if(e.target.closest('[data-action="menu"]')){$('#sidebar')?.classList.toggle('open');return}if(e.target.closest('[data-action="logout"]')){await api('/auth/logout',{method:'POST'}).catch(()=>{});logout();return}if(e.target.closest('[data-action="help"]')){toast('For this MVP, use the in-app demo accounts and the README for setup details.');return}const cancelSub=e.target.closest('[data-cancel-sub]');if(cancelSub){if(!confirm('Cancel your active subscription? It will remain valid until its current end date.'))return;try{const result=await api('/subscriptions/cancel',{method:'POST',body:{}});await refresh();render();toast(result.message)}catch(err){toast(err.message,true)}return}const buy=e.target.closest('[data-buyplan]');if(buy){purchase(buy.dataset.buyplan);return}const edit=e.target.closest('[data-editplan]');if(edit){editPlan(edit.dataset.editplan);return}const service=e.target.closest('[data-service]');if(service){state.view='book';render();$('#service-select').value=service.dataset.service;updateEstimate();return}if(e.target.closest('[data-close]')||e.target.matches('[data-closemodal]')){hideModal();return}const job=e.target.closest('[data-job]');if(job){try{await api('/bookings/status',{method:'PATCH',body:{id:job.dataset.job,status:job.dataset.status}});await refresh();render();toast('Booking updated.')}catch(err){toast(err.message,true)}return}const approve=e.target.closest('[data-approve]');if(approve){try{await api('/admin/professionals/approve',{method:'PATCH',body:{id:approve.dataset.approve,approved:true}});await refresh();render();toast('Professional approved.')}catch(err){toast(err.message,true)}return}const status=e.target.closest('[data-bookstatus]');if(status){try{await api('/bookings/status',{method:'PATCH',body:{id:status.dataset.bookstatus,status:status.dataset.status}});await refresh();render();toast('Booking status updated.')}catch(err){toast(err.message,true)}return}const detail=e.target.closest('[data-bookdetail]');if(detail){const b=(state.dashboard?.bookings||[]).find(x=>x.id===detail.dataset.bookdetail);showModal(`<div class="eyebrow">Service request</div><h3>${esc(b.serviceName)}</h3><p>${badge(b.status)}</p><div class="price-summary"><div class="price-row"><span>Date</span><strong>${esc(b.date)}</strong></div><div class="price-row"><span>Time</span><strong>${esc(b.slot)}</strong></div><div class="price-row"><span>Professional</span><strong>${esc(b.professionalName||'Awaiting assignment')}</strong></div><div class="price-row"><span>Address</span><strong>${esc(b.address)}</strong></div><div class="price-total"><span>Estimate</span><span>${inr(b.price)}</span></div></div><div class="modal-actions"><button class="btn btn-primary" data-close>Close</button></div>`);return}});
document.addEventListener('change',async e=>{if(e.target.id==='register-role')$('#pro-fields')?.classList.toggle('hidden',e.target.value!=='professional');if(e.target.id==='service-select')updateEstimate();if(e.target.id==='availability-toggle'){try{await api('/professional/availability',{method:'PATCH',body:{available:e.target.checked}});toast('Availability updated.')}catch(err){e.target.checked=!e.target.checked;toast(err.message,true)}}});
document.addEventListener('submit',async e=>{if(e.target.id==='auth-form'){e.preventDefault();const f=new FormData(e.target);try{if(state.authMode==='login'){await login(f.get('email'),f.get('password'))}else{const result=await api('/auth/register',{method:'POST',body:{name:f.get('name'),email:f.get('email'),phone:f.get('phone'),password:f.get('password'),role:f.get('role'),categories:f.getAll('categories'),documentRef:f.get('documentRef')}});await enter(result.token,result.user);toast(result.message)}}catch(err){toast(err.message,true)}}if(e.target.id==='booking-form'){e.preventDefault();const f=new FormData(e.target);try{const result=await api('/bookings',{method:'POST',body:Object.fromEntries(f.entries())});await refresh();state.view='bookings';render();toast(result.message)}catch(err){toast(err.message,true)}}const review=e.target.closest('.review-form');if(review){e.preventDefault();const f=new FormData(review);try{await api('/reviews',{method:'POST',body:{bookingId:review.dataset.review,rating:Number(f.get('rating')),feedback:f.get('feedback')}});await refresh();render();toast('Thank you for your feedback.')}catch(err){toast(err.message,true)}}});
async function boot(){try{state.plans=await api('/plans');state.services=await api('/services');if(state.token){try{state.user=await api('/me');await refresh()}catch{logout();return}}render()}catch(e){$('#app').innerHTML=`<div style="max-width:620px;margin:10vh auto;background:#fff;border:1px solid #e5e9e2;border-radius:16px;padding:30px"><h2>HomeCare Plus is starting</h2><p class="muted">${esc(e.message)}</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div>`}}
boot();
</script>
</body>
</html>
